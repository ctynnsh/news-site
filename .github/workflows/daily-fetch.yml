name: 每天抓新闻

on:
  schedule:
    - cron: "0 0 * * *"  # UTC 0 点 = 北京时间早上 8 点
  workflow_dispatch:      # 允许在 GitHub 网站上手动点一下触发，方便测试

permissions:
  contents: write  # 允许这个流程把结果提交回仓库

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行 fetch.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch.py

      - name: 提交并推送新的存档
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/
          git diff --staged --quiet || git commit -m "自动更新：$(date +'%Y-%m-%d') 新闻存档"
          git push
